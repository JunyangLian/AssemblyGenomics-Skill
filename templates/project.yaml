# AssemblyGenomics Skill 项目配置模板（backend A: SOP 包）
# 所有 null 表示未知；资源和交付目标未确认时不得启动正式任务。

schema_version: 1
project_id: example_project
# run_id: 留空则校验器生成

sample:
  id: example_sample
  organism: null
  taxid: null
  ploidy: null
  ploidy_evidence: null
  genome_size_bp: null
  genome_size_basis: null
  mixed_sample: false

delivery:
  # 交付表示必须显式声明（primary_reference / phase_separated / …）；
  # unresolved=未声明，校验与路由层阻断澄清，不默认（D-025）
  representation: unresolved
  phase_scope_required: false
  parental_identity_required: false
  organelle_policy: review_and_separate

inputs:
  libraries:
    - library_id: lib_wgs_01
      technology: illumina_wgs
      technology_source: metadata_declared
      library_type: wgs
      read_files: []
      batch: null
      read_quality: null
      sample_role: proband
  existing_assembly: null

execution:
  backend: sop_package
  framework: nextflow
  scheduler: null
  cpu_limit: 16
  memory_gb_limit: 64
  disk_gb_limit: 500
  allow_remote_upload: false
  tool_versions: null

review:
  require_plan_approval: true
  require_sequence_edit_approval: true
  require_hic_review: true
  require_release_approval: true

# 结果合理性对照锚点（D-016）：intake 确定数据来源时，一并选定最近的已发表
# 同类（同种/同属优先）写入 references；未选定不阻断路由，但最终报告必须
# 如实标注"仅类群兜底带对照"。
baselines:
  status: not_selected
  references: []
  # 例：
  # - kind: published_genome_annotation
  #   organism: Siganus canaliculatus
  #   accession_or_doi: GCA_053572195.1
  #   why: 同种已发表染色体级注释，作为注释指标对照锚
  metric_overrides: []
  # 例（由上述锚点支撑的范围；enforce=true 时范围外按 GAP 报警）：
  # - metric: protein_coding_gene_count
  #   expected_range: [20000, 28000]
  #   enforce: true
  #   based_on: GCA_053572195.1
  #   notes: 鲑科/鲤科等多倍化谱系会合法偏高，先核对倍性